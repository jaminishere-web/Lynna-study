<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3-2 고려의 대외 관계</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #7A2E2E;
    --primary-light: #A04545;
    --primary-dark: #5A1F1F;
    --accent: #C9A961;
    --accent-light: #DCC082;
    --bg: #F4EFE6;
    --paper: #FFFFFF;
    --ink: #1C1410;
    --muted: #6B5F55;
    --correct: #2D7A4D;
    --correct-bg: #DCEDE0;
    --wrong: #B83A3A;
    --wrong-bg: #F5E0E0;
    --border: #D9CFC0;
    --jaseupseo: #2E5A7A;
    --jaseupseo-bg: #E0EAF2;
    --pyeongga: #6B3A7A;
    --pyeongga-bg: #EDE0F2;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse at 10% 0%, rgba(122,46,46,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 90% 100%, rgba(201,169,97,0.10) 0%, transparent 60%);
    color: var(--ink);
    min-height: 100vh;
    padding: 24px 16px 80px;
  }

  .container { max-width: 760px; margin: 0 auto; }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 28px;
    padding-top: 12px;
  }
  .header::before {
    content: '';
    display: block;
    width: 60px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--primary), transparent);
    margin: 0 auto 16px;
  }
  .badge {
    display: inline-block;
    font-family: 'Noto Serif KR', serif;
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--primary);
    text-transform: uppercase;
    margin-bottom: 10px;
    font-weight: 700;
  }
  h1 {
    font-family: 'Noto Serif KR', serif;
    font-size: clamp(22px, 5vw, 30px);
    font-weight: 900;
    color: var(--ink);
    line-height: 1.3;
    margin-bottom: 6px;
  }
  h1 span { color: var(--primary); }
  .subtitle {
    font-size: 13px;
    color: var(--muted);
    margin-top: 6px;
  }

  /* Stats */
  .stats {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin: 20px 0 24px;
    flex-wrap: wrap;
  }
  .stat-pill {
    background: var(--paper);
    border: 1.5px solid var(--border);
    border-radius: 24px;
    padding: 8px 16px;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .stat-pill b { color: var(--primary); font-weight: 700; font-size: 14px; }
  .stat-pill.correct b { color: var(--correct); }
  .stat-pill.wrong b { color: var(--wrong); }

  /* Filters */
  .filters {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .filter-btn {
    background: var(--paper);
    border: 1.5px solid var(--border);
    color: var(--muted);
    padding: 7px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .filter-btn:hover { border-color: var(--primary-light); color: var(--primary); }
  .filter-btn.active {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
  }

  /* Controls */
  .controls {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }
  .ctrl-btn {
    background: var(--paper);
    border: 1.5px solid var(--border);
    color: var(--muted);
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }
  .ctrl-btn:hover { background: var(--bg); border-color: var(--primary-light); }

  /* Question card */
  .q-card {
    background: var(--paper);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    margin-bottom: 16px;
    overflow: hidden;
    transition: all 0.2s;
  }
  .q-card.hidden { display: none; }
  .q-card.correct { border-color: var(--correct); }
  .q-card.wrong { border-color: var(--wrong); }

  .q-card .opt,
  .q-card .ox-btn { cursor: pointer; }

  .q-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 18px 10px;
    flex-wrap: wrap;
  }
  .q-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 32px;
    height: 32px;
    border-radius: 8px;
    font-family: 'Noto Serif KR', serif;
    font-weight: 700;
    font-size: 13px;
    padding: 0 10px;
    white-space: nowrap;
    letter-spacing: 0.3px;
  }
  .q-num.jaseupseo { background: var(--jaseupseo-bg); color: var(--jaseupseo); }
  .q-num.pyeongga { background: var(--pyeongga-bg); color: var(--pyeongga); }

  .q-image {
    margin: 12px 0 14px;
    text-align: center;
    background: #FAF7F0;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
  }
  .q-image img {
    max-width: 100%;
    height: auto;
    border-radius: 4px;
  }

  .q-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .q-tag {
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 10px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .q-tag.source-j { background: var(--jaseupseo-bg); color: var(--jaseupseo); }
  .q-tag.source-p { background: var(--pyeongga-bg); color: var(--pyeongga); }
  .q-tag.important { background: #FFF4E5; color: #B5651D; }
  .q-tag.seosul { background: #E8F0E8; color: var(--correct); }
  .q-tag.exam { background: #FFE8E8; color: var(--wrong); }
  .q-tag.kaenyeom { background: #EEEAF5; color: #5A4A8A; }
  .q-tag.silryeok { background: #FFF0E5; color: #B86A1D; }

  .q-body { padding: 4px 18px 16px; }
  .q-text {
    font-size: 15px;
    line-height: 1.7;
    color: var(--ink);
    margin-bottom: 14px;
  }
  .q-source {
    background: #FAF7F0;
    border-left: 3px solid var(--accent);
    padding: 12px 14px;
    margin: 10px 0 14px;
    border-radius: 0 6px 6px 0;
    font-size: 13.5px;
    line-height: 1.65;
    color: #3D2F26;
  }
  .q-source .source-label {
    display: block;
    font-size: 10px;
    color: var(--accent);
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  /* Options */
  .options { display: flex; flex-direction: column; gap: 6px; }
  .opt {
    display: flex;
    gap: 10px;
    padding: 10px 12px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    font-size: 14px;
    line-height: 1.5;
  }
  .opt:hover { background: var(--bg); border-color: var(--primary-light); }
  .opt.selected { background: #FAF1E8; border-color: var(--primary); }
  .opt.reveal-correct { background: var(--correct-bg); border-color: var(--correct); color: var(--correct); }
  .opt.reveal-wrong { background: var(--wrong-bg); border-color: var(--wrong); }
  .opt-num {
    font-weight: 700;
    color: var(--primary);
    min-width: 20px;
  }
  .opt.reveal-correct .opt-num { color: var(--correct); }

  /* OX buttons */
  .ox-group { display: flex; gap: 10px; }
  .ox-btn {
    flex: 1;
    padding: 14px;
    border: 2px solid var(--border);
    border-radius: 10px;
    background: var(--paper);
    font-size: 24px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }
  .ox-btn:hover { border-color: var(--primary-light); }
  .ox-btn.selected { background: #FAF1E8; border-color: var(--primary); color: var(--primary); }
  .ox-btn.reveal-correct { background: var(--correct-bg); border-color: var(--correct); color: var(--correct); }
  .ox-btn.reveal-wrong { background: var(--wrong-bg); border-color: var(--wrong); color: var(--wrong); }

  /* Short answer */
  .sa-input {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    background: var(--paper);
    color: var(--ink);
  }
  .sa-input:focus { outline: none; border-color: var(--primary); }
  .sa-input:disabled { background: #F8F4EC; color: var(--muted); }
  .sa-btn {
    background: var(--primary);
    color: white;
    border: none;
    padding: 9px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    margin-top: 10px;
    font-family: inherit;
  }
  .sa-btn:hover { background: var(--primary-dark); }

  /* Feedback */
  .feedback {
    margin-top: 14px;
    padding: 14px;
    border-radius: 8px;
    font-size: 13.5px;
    line-height: 1.65;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.correct {
    background: var(--correct-bg);
    border: 1px solid var(--correct);
    color: var(--correct);
  }
  .feedback.wrong {
    background: var(--wrong-bg);
    border: 1px solid var(--wrong);
    color: var(--wrong);
  }
  .feedback.answer {
    background: #FAF7F0;
    border: 1px solid var(--accent);
    color: #3D2F26;
  }
  .feedback b { font-weight: 700; }
  .feedback .label-line {
    font-family: 'Noto Serif KR', serif;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--primary);
    font-weight: 700;
    margin-bottom: 6px;
    display: block;
  }

  /* Footer */
  .footer {
    text-align: center;
    margin-top: 40px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <span class="badge">UNIT III · 2</span>
    <h1>고려의 <span>대외 관계</span></h1>
    <div class="subtitle">자습서 p.70~71 · 평가문제집 p.87~88</div>
  </div>

  <div class="stats">
    <div class="stat-pill">총 <b id="totalCount">0</b>문제</div>
    <div class="stat-pill">진행 <b id="progressCount">0</b></div>
    <div class="stat-pill correct">정답 <b id="correctCount">0</b></div>
    <div class="stat-pill wrong">오답 <b id="wrongCount">0</b></div>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-filter="all">전체</button>
    <button class="filter-btn" data-filter="jaseupseo">자습서</button>
    <button class="filter-btn" data-filter="pyeongga">평가문제집</button>
    <button class="filter-btn" data-filter="important">⭐ 중요</button>
    <button class="filter-btn" data-filter="wrong">✗ 틀린 문제</button>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="showAllBtn">전체 정답 보기</button>
    <button class="ctrl-btn" id="hideAllBtn">정답 가리기</button>
    <button class="ctrl-btn" id="resetBtn">모두 초기화</button>
  </div>

  <div id="questionsContainer"></div>

  <div class="footer">
    LINA · KOREAN HISTORY · UNIT III·2
  </div>
</div>

/* ===== Rendering ===== */
const container = document.getElementById('questionsContainer');
const state = {};

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

function normalize(s) {
  return String(s).replace(/\s+/g, '').replace(/[.,·,()（）]/g, '').toLowerCase();
}

function render() {
  container.innerHTML = '';
  questions.forEach((q, idx) => {
    state[q.id] = state[q.id] || { revealed: false, userAnswer: null, result: null };
    const st = state[q.id];

    const card = document.createElement('div');
    card.className = 'q-card';
    card.dataset.qid = q.id;
    card.dataset.source = q.source;
    card.dataset.tags = (q.tags || []).join(',');
    if (st.result === 'correct') card.classList.add('correct');
    if (st.result === 'wrong') card.classList.add('wrong');

    const num = idx + 1;
    const sourceClass = q.source === 'jaseupseo' ? 'jaseupseo' : 'pyeongga';
    const sourceLabel = q.source === 'jaseupseo' ? '자습서' : '평가';
    const sourceTagClass = q.source === 'jaseupseo' ? 'source-j' : 'source-p';
    const displayLabel = q.label || String(num);

    let tagsHtml = `<span class="q-tag ${sourceTagClass}">${sourceLabel}</span>`;
    if ((q.tags || []).includes('important')) tagsHtml += `<span class="q-tag important">⭐ 중요</span>`;
    if ((q.tags || []).includes('kaenyeom')) tagsHtml += `<span class="q-tag kaenyeom">콕콕</span>`;
    if ((q.tags || []).includes('silryeok')) tagsHtml += `<span class="q-tag silryeok">탄탄</span>`;
    if ((q.tags || []).includes('exam')) tagsHtml += `<span class="q-tag exam">실력</span>`;
    if ((q.tags || []).includes('seosul')) tagsHtml += `<span class="q-tag seosul">서술형</span>`;

    let bodyHtml = '';
    bodyHtml += `<div class="q-text">${q.question}</div>`;

    if (q.source_text) {
      bodyHtml += `<div class="q-source"><span class="source-label">자료</span>${q.source_text}</div>`;
    }

    if (q.hasImage) {
      const imgMap = { 'jt02': IMG_JT02, 'jt06': IMG_JT06, 'jt07': IMG_JT07, 'ps02': IMG_PS02, 'ps08': IMG_PS08 };
      const imgSrc = imgMap[q.hasImage] || '';
      if (imgSrc) {
        bodyHtml += `<div class="q-image"><img src="${imgSrc}" alt="자료 이미지" /></div>`;
      }
    }

    if (q.type === 'choice') {
      bodyHtml += '<div class="options">';
      q.options.forEach((opt, i) => {
        let cls = 'opt';
        if (st.userAnswer === i) cls += ' selected';
        if (st.revealed) {
          if (i === q.answer) cls += ' reveal-correct';
          else if (st.userAnswer === i) cls += ' reveal-wrong';
        }
        bodyHtml += `<div class="${cls}" data-opt="${i}"><span class="opt-num">${i+1}.</span><span>${opt}</span></div>`;
      });
      bodyHtml += '</div>';
    } else if (q.type === 'ox') {
      bodyHtml += '<div class="ox-group">';
      ['O','X'].forEach(v => {
        let cls = 'ox-btn';
        if (st.userAnswer === v) cls += ' selected';
        if (st.revealed) {
          if (v === q.answer) cls += ' reveal-correct';
          else if (st.userAnswer === v) cls += ' reveal-wrong';
        }
        bodyHtml += `<button class="${cls}" data-ox="${v}">${v === 'O' ? '○' : '×'}</button>`;
      });
      bodyHtml += '</div>';
    } else if (q.type === 'short') {
      bodyHtml += `<input type="text" class="sa-input" placeholder="답을 입력하세요" value="${st.userAnswer || ''}" ${st.revealed ? 'disabled' : ''}/>`;
      bodyHtml += `<button class="sa-btn" data-action="check-sa">${st.revealed ? '다시 풀기' : '정답 확인'}</button>`;
    } else if (q.type === 'seosul') {
      bodyHtml += `<textarea class="sa-input" rows="4" placeholder="답을 작성해보세요" ${st.revealed ? 'disabled' : ''}>${st.userAnswer || ''}</textarea>`;
      bodyHtml += `<button class="sa-btn" data-action="show-seosul">${st.revealed ? '다시 풀기' : '모범 답안 보기'}</button>`;
    }

    let fbHtml = '';
    if (st.revealed) {
      if (q.type === 'seosul') {
        fbHtml = `<div class="feedback answer show">
          <span class="label-line">모범 답안</span>
          ${q.answer}
          ${q.explanation ? `<div style="margin-top:10px;padding-top:10px;border-top:1px dashed #C9A961;"><b>💡 ${q.explanation}</b></div>` : ''}
        </div>`;
      } else if (q.type === 'choice') {
        const isCorrect = st.userAnswer === q.answer;
        fbHtml = `<div class="feedback ${isCorrect ? 'correct' : (st.userAnswer != null ? 'wrong' : 'answer')} show">
          <span class="label-line">${isCorrect ? '✓ 정답입니다!' : (st.userAnswer != null ? '✗ 다시 확인' : '정답')}</span>
          <b>정답: ${q.answer + 1}번</b><br>${q.explanation || ''}
        </div>`;
      } else if (q.type === 'ox') {
        const isCorrect = st.userAnswer === q.answer;
        fbHtml = `<div class="feedback ${isCorrect ? 'correct' : (st.userAnswer != null ? 'wrong' : 'answer')} show">
          <span class="label-line">${isCorrect ? '✓ 정답입니다!' : (st.userAnswer != null ? '✗ 다시 확인' : '정답')}</span>
          <b>정답: ${q.answer === 'O' ? '○' : '×'}</b><br>${q.explanation || ''}
        </div>`;
      } else if (q.type === 'short') {
        const userVal = st.userAnswer || '';
        const isCorrect = q.answers.some(a => normalize(a) === normalize(userVal));
        fbHtml = `<div class="feedback ${isCorrect ? 'correct' : (userVal ? 'wrong' : 'answer')} show">
          <span class="label-line">${isCorrect ? '✓ 정답입니다!' : (userVal ? '✗ 다시 확인' : '정답')}</span>
          <b>정답: ${q.answers[0]}</b><br>${q.explanation || ''}
        </div>`;
      }
    }

    bodyHtml += fbHtml;

    card.innerHTML = `
      <div class="q-head">
        <div class="q-num ${sourceClass}">${displayLabel}</div>
        <div class="q-tags">${tagsHtml}</div>
      </div>
      <div class="q-body">${bodyHtml}</div>
    `;

    container.appendChild(card);
  });
  updateStats();
  applyFilter();
}

function updateStats() {
  const total = questions.length;
  const progress = Object.values(state).filter(s => s.revealed).length;
  const correct = Object.values(state).filter(s => s.result === 'correct').length;
  const wrong = Object.values(state).filter(s => s.result === 'wrong').length;
  document.getElementById('totalCount').textContent = total;
  document.getElementById('progressCount').textContent = progress;
  document.getElementById('correctCount').textContent = correct;
  document.getElementById('wrongCount').textContent = wrong;
}

let currentFilter = 'all';

function applyFilter() {
  document.querySelectorAll('.q-card').forEach(card => {
    const src = card.dataset.source;
    const tags = card.dataset.tags.split(',');
    const qid = card.dataset.qid;
    let show = true;
    if (currentFilter === 'jaseupseo') show = src === 'jaseupseo';
    else if (currentFilter === 'pyeongga') show = src === 'pyeongga';
    else if (currentFilter === 'important') show = tags.includes('important');
    else if (currentFilter === 'wrong') show = state[qid] && state[qid].result === 'wrong';
    card.classList.toggle('hidden', !show);
  });
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    applyFilter();
  });
});

document.getElementById('showAllBtn').addEventListener('click', () => {
  questions.forEach(q => {
    const st = state[q.id];
    st.revealed = true;
    if (q.type === 'choice' && st.userAnswer != null) {
      st.result = (st.userAnswer === q.answer) ? 'correct' : 'wrong';
    } else if (q.type === 'ox' && st.userAnswer != null) {
      st.result = (st.userAnswer === q.answer) ? 'correct' : 'wrong';
    } else if (q.type === 'short' && st.userAnswer) {
      st.result = q.answers.some(a => normalize(a) === normalize(st.userAnswer)) ? 'correct' : 'wrong';
    }
  });
  render();
});

document.getElementById('hideAllBtn').addEventListener('click', () => {
  questions.forEach(q => { state[q.id].revealed = false; });
  render();
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if (!confirm('모든 답안과 결과를 초기화할까요?')) return;
  questions.forEach(q => { state[q.id] = { revealed: false, userAnswer: null, result: null }; });
  render();
});

container.addEventListener('click', (e) => {
  const card = e.target.closest('.q-card');
  if (!card) return;
  const qid = card.dataset.qid;
  const q = questions.find(x => x.id === qid);
  const st = state[qid];

  const opt = e.target.closest('.opt');
  if (opt) {
    if (st.revealed) {
      state[qid] = { revealed: false, userAnswer: null, result: null };
    } else {
      st.userAnswer = parseInt(opt.dataset.opt);
      st.revealed = true;
      st.result = (st.userAnswer === q.answer) ? 'correct' : 'wrong';
    }
    render();
    return;
  }

  const ox = e.target.closest('.ox-btn');
  if (ox) {
    if (st.revealed) {
      state[qid] = { revealed: false, userAnswer: null, result: null };
    } else {
      st.userAnswer = ox.dataset.ox;
      st.revealed = true;
      st.result = (st.userAnswer === q.answer) ? 'correct' : 'wrong';
    }
    render();
    return;
  }

  const action = e.target.dataset.action;
  if (action === 'check-sa') {
    if (st.revealed) {
      state[qid] = { revealed: false, userAnswer: null, result: null };
    } else {
      const input = card.querySelector('.sa-input');
      st.userAnswer = input.value.trim();
      st.revealed = true;
      if (st.userAnswer) {
        st.result = q.answers.some(a => normalize(a) === normalize(st.userAnswer)) ? 'correct' : 'wrong';
      }
    }
    render();
  } else if (action === 'show-seosul') {
    if (st.revealed) {
      state[qid] = { revealed: false, userAnswer: null, result: null };
    } else {
      const ta = card.querySelector('.sa-input');
      st.userAnswer = ta.value.trim();
      st.revealed = true;
    }
    render();
  }
});

container.addEventListener('input', (e) => {
  if (e.target.classList.contains('sa-input')) {
    const card = e.target.closest('.q-card');
    const qid = card.dataset.qid;
    if (!state[qid].revealed) state[qid].userAnswer = e.target.value;
  }
});

render();
</script>
</body>
</html>
