<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ⅳ-02. 시장 가격의 결정</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #7A2E2E;
    --primary-light: #A04545;
    --primary-dark: #5A1F1F;
    --accent: #C9A961;
    --accent-light: #DCC082;
    --bg: #F4EFE6;
    --paper: #FFFFFF;
    --ink: #1C1410;
    --muted: #6B5F55;
    --correct: #2D7A4D;
    --correct-bg: #DCEDE0;
    --wrong: #B83A3A;
    --wrong-bg: #F5E0E0;
    --border: #D9CFC0;
    --jaseupseo: #2E5A7A;
    --jaseupseo-bg: #E0EAF2;
    --pyeongga: #6B3A7A;
    --pyeongga-bg: #EDE0F2;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse at 10% 0%, rgba(122,46,46,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 90% 100%, rgba(201,169,97,0.10) 0%, transparent 60%);
    color: var(--ink);
    min-height: 100vh;
    padding: 24px 16px 80px;
  }

  .wrap { max-width: 820px; margin: 0 auto; }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 28px;
    padding: 28px 20px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    border-radius: 18px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 28px rgba(90,31,31,0.28);
  }
  .header::before {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: repeating-linear-gradient(45deg, transparent, transparent 18px, rgba(201,169,97,0.05) 18px, rgba(201,169,97,0.05) 36px);
  }
  .header-badge {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--accent-light);
    font-weight: 700;
    margin-bottom: 10px;
    position: relative;
  }
  .header h1 {
    font-family: 'Noto Serif KR', serif;
    font-size: clamp(22px, 5vw, 32px);
    font-weight: 900;
    color: #fff;
    position: relative;
    line-height: 1.3;
  }
  .header .sub {
    margin-top: 8px;
    font-size: 13px;
    color: rgba(255,255,255,0.82);
    position: relative;
  }

  /* Progress */
  .progress-card {
    background: var(--paper);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 18px;
    box-shadow: 0 3px 14px rgba(0,0,0,0.06);
    border: 1px solid var(--border);
  }
  .progress-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .progress-label { font-size: 13px; color: var(--muted); font-weight: 500; }
  .progress-score { font-size: 15px; font-weight: 900; color: var(--primary); }
  .progress-score span { color: var(--muted); font-weight: 500; font-size: 13px; }
  .progress-bar {
    height: 8px;
    background: var(--bg);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--primary-light));
    border-radius: 99px;
    width: 0%;
    transition: width 0.4s ease;
  }
  .progress-stats {
    display: flex;
    gap: 16px;
    margin-top: 10px;
    font-size: 12px;
  }
  .progress-stats .ok { color: var(--correct); font-weight: 700; }
  .progress-stats .no { color: var(--wrong); font-weight: 700; }

  /* Controls */
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }
  .btn {
    flex: 1;
    min-width: 90px;
    padding: 11px 10px;
    border: none;
    border-radius: 10px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.18s ease;
    background: var(--paper);
    color: var(--primary);
    border: 1.5px solid var(--border);
  }
  .btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn.primary:hover { background: var(--primary-dark); }

  /* Filter tabs */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-bottom: 20px;
  }
  .filter-tab {
    padding: 8px 14px;
    border-radius: 99px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    background: var(--paper);
    color: var(--muted);
    border: 1.5px solid var(--border);
    transition: all 0.18s ease;
  }
  .filter-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  /* Question card */
  .q-card {
    background: var(--paper);
    border-radius: 16px;
    padding: 22px 20px;
    margin-bottom: 16px;
    box-shadow: 0 3px 16px rgba(0,0,0,0.06);
    border: 1px solid var(--border);
    position: relative;
  }
  .q-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .q-num {
    font-family: 'Noto Serif KR', serif;
    font-size: 14px;
    font-weight: 900;
    color: #fff;
    background: var(--primary);
    width: 34px; height: 34px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .src-tag {
    font-size: 11px;
    font-weight: 700;
    padding: 4px 9px;
    border-radius: 6px;
  }
  .src-tag.jaseupseo { background: var(--jaseupseo-bg); color: var(--jaseupseo); }
  .src-tag.pyeongga { background: var(--pyeongga-bg); color: var(--pyeongga); }
  .type-tag {
    font-size: 11px;
    font-weight: 700;
    padding: 4px 9px;
    border-radius: 6px;
    background: var(--bg);
    color: var(--muted);
  }
  .star-btn {
    margin-left: auto;
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    opacity: 0.3;
    transition: all 0.18s ease;
    line-height: 1;
  }
  .star-btn.on { opacity: 1; transform: scale(1.1); }

  .q-text {
    font-size: 15.5px;
    line-height: 1.65;
    font-weight: 500;
    margin-bottom: 14px;
    word-break: keep-all;
  }
  .q-passage {
    background: var(--bg);
    border-left: 3px solid var(--accent);
    border-radius: 0 8px 8px 0;
    padding: 12px 14px;
    margin-bottom: 14px;
    font-size: 14px;
    line-height: 1.7;
    color: #3A2E26;
    word-break: keep-all;
  }
  .q-image {
    margin-bottom: 14px;
    text-align: center;
    background: #FFF;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
  }
  .q-image img {
    max-width: 100%;
    height: auto;
    border-radius: 6px;
    display: block;
    margin: 0 auto;
  }
  .q-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 14px;
    font-size: 13.5px;
  }
  .q-table th, .q-table td {
    border: 1px solid var(--border);
    padding: 8px 10px;
    text-align: center;
  }
  .q-table th { background: var(--primary); color: #fff; font-weight: 700; }
  .q-table tr:nth-child(even) td { background: var(--bg); }

  /* Choices */
  .choices { display: flex; flex-direction: column; gap: 8px; }
  .choice {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    cursor: pointer;
    transition: all 0.16s ease;
    font-size: 14.5px;
    line-height: 1.5;
    background: var(--paper);
    word-break: keep-all;
  }
  .choice:hover { border-color: var(--primary-light); background: #FBF8F2; }
  .choice-num {
    font-weight: 900;
    color: var(--primary);
    flex-shrink: 0;
  }
  .choice.correct {
    background: var(--correct-bg);
    border-color: var(--correct);
    color: var(--correct);
    font-weight: 700;
  }
  .choice.correct .choice-num { color: var(--correct); }
  .choice.wrong {
    background: var(--wrong-bg);
    border-color: var(--wrong);
    color: var(--wrong);
    font-weight: 700;
  }
  .choice.wrong .choice-num { color: var(--wrong); }

  /* OX */
  .ox-wrap { display: flex; gap: 12px; }
  .ox-btn {
    flex: 1;
    padding: 18px;
    border-radius: 12px;
    border: 2px solid var(--border);
    background: var(--paper);
    font-size: 28px;
    font-weight: 900;
    cursor: pointer;
    transition: all 0.16s ease;
    color: var(--muted);
  }
  .ox-btn:hover { border-color: var(--primary-light); }
  .ox-btn.correct { background: var(--correct-bg); border-color: var(--correct); color: var(--correct); }
  .ox-btn.wrong { background: var(--wrong-bg); border-color: var(--wrong); color: var(--wrong); }

  /* Short / essay */
  .short-input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-family: inherit;
    font-size: 14.5px;
    margin-bottom: 10px;
  }
  .short-input:focus { outline: none; border-color: var(--primary); }
  textarea.short-input { min-height: 80px; resize: vertical; }

  .reveal-btn {
    background: var(--accent);
    color: var(--primary-dark);
    border: none;
    padding: 10px 18px;
    border-radius: 9px;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.18s ease;
  }
  .reveal-btn:hover { background: var(--accent-light); }
  .reveal-btn.shown { background: var(--muted); color: #fff; }

  /* Reset hint */
  .reset-hint {
    margin-top: 8px;
    font-size: 11px;
    color: var(--muted);
    font-style: italic;
    text-align: right;
    opacity: 0.7;
  }

  /* Answer / explanation */
  .answer-box {
    margin-top: 14px;
    padding: 14px 16px;
    background: linear-gradient(135deg, #FBF6EC 0%, #F5EFE2 100%);
    border: 1px solid var(--accent);
    border-radius: 10px;
    display: none;
  }
  .answer-box.show { display: block; animation: slideDown 0.3s ease; }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .answer-label {
    font-size: 11px;
    font-weight: 900;
    color: var(--primary);
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .answer-text {
    font-size: 14.5px;
    font-weight: 700;
    color: var(--primary-dark);
    margin-bottom: 8px;
    line-height: 1.6;
  }
  .explain-text {
    font-size: 13.5px;
    line-height: 1.7;
    color: #3A2E26;
    word-break: keep-all;
  }

  .empty {
    text-align: center;
    padding: 50px 20px;
    color: var(--muted);
    font-size: 14px;
  }

  .footer {
    text-align: center;
    margin-top: 30px;
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="header-badge">사회 · 자습서 &amp; 평가문제집</div>
    <h1>Ⅳ-02. 시장 가격의 결정</h1>
    <div class="sub">자습서(스스로 확인하기 · 탄탄 실력 다지기) · 평가문제집(내공 다지기)</div>
  </div>

  <div class="progress-card">
    <div class="progress-top">
      <div class="progress-label">학습 진행률</div>
      <div class="progress-score" id="scoreNum">0 <span>/ 0</span></div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-stats">
      <span class="ok" id="okCount">정답 0</span>
      <span class="no" id="noCount">오답 0</span>
    </div>
  </div>

  <div class="controls">
    <button class="btn" onclick="revealAll()">정답 모두 보기</button>
    <button class="btn" onclick="hideAll()">정답 모두 숨기기</button>
    <button class="btn primary" onclick="resetAll()">↻ 전체 초기화</button>
  </div>

  <div class="filters" id="filters"></div>

  <div id="quizList"></div>

  <div class="footer">린아 학습앱 · 시장 경제와 가격 📚</div>
</div>

<script>

// ---- State ----
let answered = {};   // id -> {value, correct}
let revealedSet = {}; // id -> true (short/essay reveal)
let starred = {};
let currentFilter = 'all';

const TYPE_LABEL = { mc: '객관식', ox: 'O·X', short: '단답형', essay: '서술형' };
const SRC_LABEL = { jaseupseo: '자습서', pyeongga: '평가문제집' };

const FILTERS = [
  { key: 'all', label: '전체' },
  { key: 'jaseupseo', label: '자습서' },
  { key: 'pyeongga', label: '평가문제집' },
  { key: 'star', label: '⭐ 중요' },
  { key: 'wrong', label: '✗ 틀린 문제' }
];

function buildFilters() {
  const box = document.getElementById('filters');
  box.innerHTML = FILTERS.map(f =>
    `<div class="filter-tab ${f.key === currentFilter ? 'active' : ''}" onclick="setFilter('${f.key}')">${f.label}</div>`
  ).join('');
}

function setFilter(key) {
  currentFilter = key;
  buildFilters();
  render();
}

function getVisible() {
  return questions.filter(q => {
    if (currentFilter === 'all') return true;
    if (currentFilter === 'jaseupseo') return q.src === 'jaseupseo';
    if (currentFilter === 'pyeongga') return q.src === 'pyeongga';
    if (currentFilter === 'star') return starred[q.id];
    if (currentFilter === 'wrong') return answered[q.id] && !answered[q.id].correct;
    return true;
  });
}

const NUM = ['①','②','③','④','⑤','⑥'];

function render() {
  const list = document.getElementById('quizList');
  const visible = getVisible();
  if (visible.length === 0) {
    list.innerHTML = '<div class="empty">해당하는 문제가 없어요.</div>';
    updateProgress();
    return;
  }
  list.innerHTML = visible.map((q, idx) => renderCard(q, idx)).join('');
  updateProgress();
}

function renderCard(q, idx) {
  let head = `
    <div class="q-head">
      <div class="q-num">${q._srcNum}</div>
      <span class="src-tag ${q.src}">${SRC_LABEL[q.src]}</span>
      <span class="type-tag">${q._area}</span>
      <span class="type-tag">${TYPE_LABEL[q.type]}</span>
      <button class="star-btn ${starred[q.id] ? 'on' : ''}" onclick="toggleStar('${q.id}')">${starred[q.id] ? '⭐' : '☆'}</button>
    </div>`;

  let body = `<div class="q-text">${q.q}</div>`;
  if (q.passage) body += `<div class="q-passage">${q.passage}</div>`;
  if (q.image) body += `<div class="q-image"><img src="${q.image}" alt="문제 그림"></div>`;
  if (q.table) {
    body += `<table class="q-table"><thead><tr>${q.table.head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${q.table.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  }

  if (q.type === 'mc') body += renderMC(q);
  else if (q.type === 'ox') body += renderOX(q);
  else body += renderShort(q);

  return `<div class="q-card" id="card-${q.id}">${head}${body}</div>`;
}

function renderMC(q) {
  const a = answered[q.id];
  let html = '<div class="choices">';
  q.choices.forEach((c, i) => {
    let cls = '';
    if (a) {
      if (i === q.correct) cls = 'correct';
      else if (i === a.value) cls = 'wrong';
    }
    html += `<div class="choice ${cls}" onclick="selectMC('${q.id}', ${i})"><span class="choice-num">${NUM[i]}</span><span>${c}</span></div>`;
  });
  html += '</div>';
  if (a) {
    html += `<div class="reset-hint">↻ 다시 클릭하면 초기화돼요</div>`;
    html += answerBox(q);
  }
  return html;
}

function renderOX(q) {
  const a = answered[q.id];
  let oCls = '', xCls = '';
  if (a) {
    if (q.answer === 'O') oCls = 'correct'; else xCls = 'correct';
    if (a.value !== q.answer) { if (a.value === 'O') oCls = 'wrong'; else xCls = 'wrong'; }
  }
  let html = `<div class="ox-wrap">
    <button class="ox-btn ${oCls}" onclick="selectOX('${q.id}','O')">O</button>
    <button class="ox-btn ${xCls}" onclick="selectOX('${q.id}','X')">X</button>
  </div>`;
  if (a) {
    html += `<div class="reset-hint">↻ 다시 클릭하면 초기화돼요</div>`;
    html += answerBox(q);
  }
  return html;
}

function renderShort(q) {
  const shown = revealedSet[q.id];
  const tag = q.type === 'essay' ? 'textarea' : 'input';
  let html = `<${tag} class="short-input" placeholder="여기에 답을 적어보세요" ${q.type==='essay'?'':'type="text"'}></${tag}>`;
  html += `<button class="reveal-btn ${shown?'shown':''}" onclick="toggleReveal('${q.id}')">${shown?'↻ 다시 풀기':'정답 확인'}</button>`;
  if (shown) html += answerBox(q);
  return html;
}

function answerBox(q) {
  let ans = '';
  if (q.type === 'mc') ans = `${NUM[q.correct]} ${q.choices[q.correct]}`;
  else if (q.type === 'ox') ans = q.answer;
  else ans = q.answer;
  return `<div class="answer-box show">
    <div class="answer-label">정답</div>
    <div class="answer-text">${ans}</div>
    <div class="explain-text">${q.explain || ''}</div>
  </div>`;
}

// ---- Interactions ----
function selectMC(id, i) {
  const q = questions.find(x => x.id === id);
  if (answered[id]) { delete answered[id]; render(); return; }
  answered[id] = { value: i, correct: i === q.correct };
  render();
}

function selectOX(id, val) {
  const q = questions.find(x => x.id === id);
  if (answered[id]) { delete answered[id]; render(); return; }
  answered[id] = { value: val, correct: val === q.answer };
  render();
}

function toggleReveal(id) {
  if (revealedSet[id]) delete revealedSet[id];
  else revealedSet[id] = true;
  render();
}

function toggleStar(id) {
  if (starred[id]) delete starred[id];
  else starred[id] = true;
  render();
}

function revealAll() {
  questions.forEach(q => {
    if (q.type === 'mc') answered[q.id] = { value: q.correct, correct: true };
    else if (q.type === 'ox') answered[q.id] = { value: q.answer, correct: true };
    else revealedSet[q.id] = true;
  });
  render();
}

function hideAll() {
  answered = {};
  revealedSet = {};
  render();
}

function resetAll() {
  answered = {};
  revealedSet = {};
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateProgress() {
  // 진행률: 객관식·OX는 answered, 단답·서술형은 revealed 기준
  let done = 0, ok = 0, no = 0;
  questions.forEach(q => {
    if (q.type === 'mc' || q.type === 'ox') {
      if (answered[q.id]) { done++; if (answered[q.id].correct) ok++; else no++; }
    } else {
      if (revealedSet[q.id]) done++;
    }
  });
  const total = questions.length;
  const pct = Math.round(done / total * 100);
  document.getElementById('scoreNum').innerHTML = `${done} <span>/ ${total}</span>`;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('okCount').textContent = `정답 ${ok}`;
  document.getElementById('noCount').textContent = `오답 ${no}`;
}

// 출처/영역별 번호 부여 (id 접두사 기준)
const SUB_LABEL = {
  js: { src: '자습서', area: '스스로 확인하기' },
  pt: { src: '자습서', area: '탄탄 실력 다지기' },
  pd: { src: '자습서', area: '탄탄 실력 다지기' },
  pg: { src: '평가문제집', area: '내공 다지기' }
};
(function assignNums(){
  const counters = {};
  questions.forEach(q => {
    const pre = q.id.replace(/[0-9]+$/, '');
    counters[pre] = (counters[pre] || 0) + 1;
    q._srcNum = String(counters[pre]).padStart(2,'0');
    q._area = (SUB_LABEL[pre] && SUB_LABEL[pre].area) || '';
  });
})();

buildFilters();
render();
</script>
