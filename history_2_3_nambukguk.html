<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2-3 남북국의 문화와 대외 관계</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #7A2E2E;
    --primary-light: #A04545;
    --primary-dark: #5A1F1F;
    --accent: #C9A961;
    --accent-light: #DCC082;
    --bg: #F4EFE6;
    --paper: #FFFFFF;
    --ink: #1C1410;
    --muted: #6B5F55;
    --correct: #2D7A4D;
    --correct-bg: #DCEDE0;
    --wrong: #B83A3A;
    --wrong-bg: #F5E0E0;
    --border: #D9CFC0;
    --jaseupseo: #2E5A7A;
    --jaseupseo-bg: #E0EAF2;
    --pyeongga: #6B3A7A;
    --pyeongga-bg: #EDE0F2;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse at 10% 0%, rgba(122,46,46,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 90% 100%, rgba(201,169,97,0.10) 0%, transparent 60%);
    color: var(--ink);
    min-height: 100vh;
    padding: 24px 16px 80px;
  }

  .container { max-width: 760px; margin: 0 auto; }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 28px;
    padding-top: 12px;
  }
  .header::before {
    content: '';
    display: block;
    width: 60px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--primary), transparent);
    margin: 0 auto 16px;
  }
  .badge {
    display: inline-block;
    font-family: 'Noto Serif KR', serif;
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--primary);
    text-transform: uppercase;
    margin-bottom: 10px;
    font-weight: 700;
  }
  h1 {
    font-family: 'Noto Serif KR', serif;
    font-size: clamp(22px, 5vw, 30px);
    font-weight: 900;
    color: var(--ink);
    line-height: 1.3;
    margin-bottom: 6px;
  }
  h1 span { color: var(--primary); }
  .subtitle {
    font-size: 13px;
    color: var(--muted);
    margin-top: 6px;
  }

  /* Progress */
  .progress-bar {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .progress-stats {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .progress-stats .label { color: var(--muted); font-weight: 500; }
  .progress-stats .stat { display: flex; gap: 12px; }
  .progress-stats .correct-stat { color: var(--correct); font-weight: 700; }
  .progress-stats .wrong-stat { color: var(--wrong); font-weight: 700; }
  .progress-stats .pct { color: var(--primary); font-weight: 700; font-size: 14px; }
  .progress-track {
    background: var(--bg);
    height: 6px;
    border-radius: 3px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary), var(--accent));
    transition: width .4s ease;
    width: 0%;
  }

  /* Filter Tabs */
  .filter-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .filter-tab {
    flex: 1;
    min-width: 90px;
    padding: 9px 8px;
    border: 1px solid var(--border);
    background: var(--paper);
    color: var(--muted);
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    font-family: inherit;
  }
  .filter-tab:hover { border-color: var(--primary-light); color: var(--primary); }
  .filter-tab.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }

  /* Section Header */
  .section-header {
    margin: 28px 0 12px;
    padding: 14px 16px;
    border-radius: 10px;
    font-family: 'Noto Serif KR', serif;
    font-weight: 700;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-header.jaseupseo {
    background: var(--jaseupseo-bg);
    color: var(--jaseupseo);
    border-left: 4px solid var(--jaseupseo);
  }
  .section-header.pyeongga {
    background: var(--pyeongga-bg);
    color: var(--pyeongga);
    border-left: 4px solid var(--pyeongga);
  }
  .section-header .icon { font-size: 18px; }
  .section-header .sub {
    font-size: 11px;
    font-weight: 500;
    opacity: 0.75;
    margin-left: auto;
  }

  /* Question Card */
  .question-card {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    transition: all .2s;
  }
  .question-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
  .question-card.answered.correct {
    border-color: var(--correct);
    box-shadow: 0 2px 12px rgba(45,122,77,0.15);
  }
  .question-card.answered.wrong {
    border-color: var(--wrong);
    box-shadow: 0 2px 12px rgba(184,58,58,0.15);
  }

  .q-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .q-num {
    font-family: 'Noto Serif KR', serif;
    font-weight: 900;
    background: var(--primary);
    color: white;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
  }
  .q-num.jaseupseo-num { background: var(--jaseupseo); }
  .q-num.pyeongga-num { background: var(--pyeongga); }

  .q-tag {
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 4px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .q-tag.kok { background: #E8F0E8; color: #3A6B3A; }
  .q-tag.tan { background: #F5E8DC; color: #8B4513; }
  .q-tag.juyo { background: var(--accent); color: white; }
  .q-tag.seosul { background: #DCE8F5; color: #1F4F7A; }
  .q-tag.simhwa { background: #F5DCE8; color: #7A1F4F; }

  .q-text {
    font-size: 15px;
    line-height: 1.6;
    font-weight: 500;
    color: var(--ink);
    margin-bottom: 12px;
  }

  .q-passage {
    background: #FAF6EF;
    border-left: 3px solid var(--accent);
    padding: 12px 14px;
    margin: 10px 0 14px;
    border-radius: 0 6px 6px 0;
    font-size: 14px;
    line-height: 1.6;
    color: #4A3F35;
  }

  /* Options (객관식) */
  .options { display: flex; flex-direction: column; gap: 7px; margin-top: 12px; }
  .option {
    background: #FAF7F2;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
    line-height: 1.5;
    cursor: pointer;
    transition: all .15s;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-family: inherit;
    text-align: left;
    color: var(--ink);
  }
  .option:hover:not(:disabled) {
    border-color: var(--primary-light);
    background: #FFF8F0;
  }
  .option:disabled { cursor: default; }
  .option-num {
    font-weight: 700;
    color: var(--primary);
    flex-shrink: 0;
    width: 18px;
  }
  .option.selected.correct {
    background: var(--correct-bg);
    border-color: var(--correct);
    color: var(--correct);
    font-weight: 600;
  }
  .option.selected.correct .option-num { color: var(--correct); }
  .option.selected.wrong {
    background: var(--wrong-bg);
    border-color: var(--wrong);
    color: var(--wrong);
    font-weight: 600;
  }
  .option.selected.wrong .option-num { color: var(--wrong); }
  .option.reveal-correct {
    background: var(--correct-bg);
    border-color: var(--correct);
    color: var(--correct);
    font-weight: 600;
  }
  .option.reveal-correct .option-num { color: var(--correct); }

  /* Short Answer (단답형/서술형) */
  .short-answer-wrap {
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .short-input {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    background: #FAF7F2;
    color: var(--ink);
    transition: all .15s;
  }
  .short-input:focus {
    outline: none;
    border-color: var(--primary);
    background: white;
  }
  .short-input:disabled { cursor: default; opacity: 0.85; }
  .short-textarea {
    min-height: 70px;
    resize: vertical;
    line-height: 1.5;
  }
  .reveal-btn {
    align-self: flex-start;
    padding: 7px 14px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: background .15s;
  }
  .reveal-btn:hover { background: var(--primary-dark); }
  .reveal-btn.shown { background: var(--muted); }

  /* Reset hint after answering */
  .reset-hint {
    margin-top: 8px;
    font-size: 11px;
    color: var(--muted);
    font-style: italic;
    text-align: right;
    opacity: 0.7;
  }

  /* OX Type */
  .ox-options {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }
  .ox-btn {
    flex: 1;
    padding: 14px;
    border: 2px solid var(--border);
    background: #FAF7F2;
    border-radius: 10px;
    font-size: 22px;
    font-weight: 900;
    cursor: pointer;
    transition: all .15s;
    font-family: inherit;
  }
  .ox-btn:hover:not(:disabled) {
    border-color: var(--primary-light);
    background: #FFF8F0;
  }
  .ox-btn.o-btn { color: var(--correct); }
  .ox-btn.x-btn { color: var(--wrong); }
  .ox-btn.selected.correct {
    background: var(--correct-bg);
    border-color: var(--correct);
  }
  .ox-btn.selected.wrong {
    background: var(--wrong-bg);
    border-color: var(--wrong);
  }
  .ox-btn.reveal {
    background: var(--correct-bg);
    border-color: var(--correct);
  }
  .ox-btn:disabled { cursor: default; }

  /* Answer/Explanation */
  .answer-box {
    margin-top: 14px;
    padding: 14px 16px;
    background: #FAF6EF;
    border-radius: 10px;
    border-left: 4px solid var(--accent);
    display: none;
    animation: slideDown .25s ease;
  }
  .answer-box.show { display: block; }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .answer-label {
    font-family: 'Noto Serif KR', serif;
    font-weight: 700;
    color: var(--primary);
    font-size: 12px;
    letter-spacing: 1px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .answer-label::before {
    content: '✦';
    color: var(--accent);
  }
  .answer-text {
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink);
    font-weight: 500;
  }
  .answer-text strong { color: var(--primary); font-weight: 700; }
  .explanation {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
    font-size: 13px;
    line-height: 1.6;
    color: var(--muted);
  }

  /* Control Bar */
  .control-bar {
    position: sticky;
    bottom: 12px;
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 14px;
    margin-top: 20px;
    display: flex;
    gap: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.10);
  }
  .ctrl-btn {
    flex: 1;
    padding: 10px 8px;
    border: 1px solid var(--border);
    background: var(--paper);
    color: var(--ink);
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all .15s;
    font-family: inherit;
  }
  .ctrl-btn:hover { background: var(--bg); border-color: var(--primary-light); }
  .ctrl-btn.primary { background: var(--primary); color: white; border-color: var(--primary); }
  .ctrl-btn.primary:hover { background: var(--primary-dark); }
  .ctrl-btn.danger { background: var(--wrong); color: white; border-color: var(--wrong); }
  .ctrl-btn.danger:hover { background: #9A2E2E; }

  /* Image placeholder */
  .image-note {
    background: #F0E8DC;
    border: 1px dashed var(--accent);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 12px;
    color: var(--muted);
    margin: 8px 0;
    font-style: italic;
  }

  /* Question image */
  .q-image-wrap {
    margin: 12px 0;
    text-align: center;
    background: #FAF6EF;
    border-radius: 10px;
    padding: 12px;
    border: 1px solid var(--border);
  }
  .q-image-wrap img {
    max-width: 100%;
    max-height: 340px;
    height: auto;
    border-radius: 6px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.10);
    cursor: zoom-in;
    transition: transform .2s;
  }
  .q-image-wrap img:hover {
    transform: scale(1.02);
  }
  .q-image-caption {
    margin-top: 8px;
    font-size: 11px;
    color: var(--muted);
    font-style: italic;
  }

  /* Image modal (zoom) */
  .img-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    padding: 20px;
    cursor: zoom-out;
  }
  .img-modal.show { display: flex; }
  .img-modal img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 6px;
  }
  .img-modal-close {
    position: absolute;
    top: 16px;
    right: 20px;
    color: white;
    font-size: 32px;
    cursor: pointer;
    background: none;
    border: none;
    font-weight: 300;
  }

  @media (max-width: 480px) {
    body { padding: 16px 10px 80px; }
    .question-card { padding: 14px 14px; }
    .q-text { font-size: 14px; }
    .option { font-size: 13px; padding: 9px 11px; }
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="badge">중학교 역사 2-3</div>
    <h1><span>남북국</span>의 문화와 대외 관계</h1>
    <div class="subtitle">자습서 · 평가문제집 통합 문제 (총 63문제)</div>
  </div>

  <div class="progress-bar">
    <div class="progress-stats">
      <span class="label">진행 상황</span>
      <span class="stat">
        <span class="correct-stat">✓ <span id="correctCount">0</span></span>
        <span class="wrong-stat">✗ <span id="wrongCount">0</span></span>
        <span class="pct"><span id="answeredCount">0</span>/63</span>
      </span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="filter-tabs">
    <button class="filter-tab active" data-filter="all">전체</button>
    <button class="filter-tab" data-filter="jaseupseo">자습서</button>
    <button class="filter-tab" data-filter="pyeongga">평가문제집</button>
    <button class="filter-tab" data-filter="juyo">⭐ 중요</button>
    <button class="filter-tab" data-filter="wrong">✗ 틀린 문제</button>
  </div>

  <div id="quizContent"></div>

  <div class="control-bar">
    <button class="ctrl-btn" onclick="revealAll()">전체 정답 보기</button>
    <button class="ctrl-btn" onclick="hideAll()">전체 가리기</button>
    <button class="ctrl-btn danger" onclick="resetAll()">초기화</button>
  </div>
</div>

<!-- Image zoom modal -->
<div class="img-modal" id="imgModal" onclick="closeImageModal()">
  <button class="img-modal-close" onclick="closeImageModal()">×</button>
  <img id="modalImg" src="" alt="">
</div>

const TOTAL = questions.length;
let answered = {}; // {id: {type, correct, value}}
let currentFilter = 'all';

const sectionMap = {
  '콕콕 개념 확인': { source: 'jaseupseo', icon: '📘' },
  '탄탄 실력 기르기': { source: 'jaseupseo', icon: '✏️' },
  '탄탄 실력 다지기': { source: 'pyeongga', icon: '📝' },
  '쑥쑥 실력 키우기': { source: 'pyeongga', icon: '🎯' }
};

function render() {
  const container = document.getElementById('quizContent');
  container.innerHTML = '';
  
  let filtered = questions;
  if (currentFilter === 'jaseupseo') filtered = questions.filter(q => q.source === 'jaseupseo');
  else if (currentFilter === 'pyeongga') filtered = questions.filter(q => q.source === 'pyeongga');
  else if (currentFilter === 'juyo') filtered = questions.filter(q => q.tag === 'juyo');
  else if (currentFilter === 'wrong') filtered = questions.filter(q => answered[q.id] && !answered[q.id].correct);
  
  if (filtered.length === 0) {
    container.innerHTML = '<div style="text-align:center; padding:40px; color:var(--muted);">해당하는 문제가 없습니다.</div>';
    return;
  }
  
  let lastSection = '';
  filtered.forEach(q => {
    if (q.section !== lastSection) {
      const info = sectionMap[q.section];
      const sectionEl = document.createElement('div');
      sectionEl.className = `section-header ${info.source}`;
      sectionEl.innerHTML = `<span class="icon">${info.icon}</span><span>${q.section}</span><span class="sub">${info.source === 'jaseupseo' ? '자습서' : '평가문제집'}</span>`;
      container.appendChild(sectionEl);
      lastSection = q.section;
    }
    container.appendChild(buildCard(q));
  });
  updateProgress();
}

function buildCard(q) {
  const card = document.createElement('div');
  card.className = 'question-card';
  const ans = answered[q.id];
  if (ans) card.classList.add('answered', ans.correct ? 'correct' : 'wrong');
  
  const sourceClass = q.source === 'jaseupseo' ? 'jaseupseo-num' : 'pyeongga-num';
  
  let tagHtml = '';
  if (q.tag === 'juyo') tagHtml = '<span class="q-tag juyo">⭐ 중요</span>';
  else if (q.tag === 'seosul') tagHtml = '<span class="q-tag seosul">서술형</span>';
  else if (q.tag === 'kok') tagHtml = '<span class="q-tag kok">개념확인</span>';
  else if (q.tag === 'tan') tagHtml = '<span class="q-tag tan">실력</span>';
  
  let html = `
    <div class="q-head">
      <div class="q-num ${sourceClass}">${q.id}</div>
      ${tagHtml}
    </div>
    <div class="q-text">${q.question}</div>
  `;
  
  if (q.passage) {
    html += `<div class="q-passage">${q.passage}</div>`;
  }
  
  if (q.image && typeof IMAGES !== 'undefined' && IMAGES[q.image]) {
    html += `<div class="q-image-wrap">
      <img src="${IMAGES[q.image]}" alt="${q.imageCaption || ''}" onclick="openImageModal('${q.image}')">
      ${q.imageCaption ? `<div class="q-image-caption">▲ ${q.imageCaption}</div>` : ''}
    </div>`;
  }
  
  if (q.type === 'mc') {
    html += '<div class="options">';
    q.options.forEach((opt, i) => {
      const num = ['①','②','③','④','⑤','⑥','⑦','⑧'][i];
      let cls = 'option';
      if (ans) {
        if (i === ans.value && ans.correct) cls += ' selected correct';
        else if (i === ans.value && !ans.correct) cls += ' selected wrong';
        else if (i === q.correct) cls += ' reveal-correct';
      }
      html += `<button class="${cls}" onclick="selectMC(${q.id}, ${i})">
        <span class="option-num">${num}</span>
        <span>${opt}</span>
      </button>`;
    });
    html += '</div>';
    if (ans) html += '<div class="reset-hint">↻ 아무 보기나 다시 클릭하면 초기화돼요</div>';
  } else if (q.type === 'ox') {
    html += '<div class="ox-options">';
    ['O','X'].forEach(val => {
      let cls = 'ox-btn ' + (val === 'O' ? 'o-btn' : 'x-btn');
      if (ans) {
        if (ans.value === val && ans.correct) cls += ' selected correct';
        else if (ans.value === val && !ans.correct) cls += ' selected wrong';
        else if (val === q.answer) cls += ' reveal';
      }
      html += `<button class="${cls}" onclick="selectOX(${q.id}, '${val}')">${val}</button>`;
    });
    html += '</div>';
    if (ans) html += '<div class="reset-hint">↻ 다시 클릭하면 초기화돼요</div>';
  } else if (q.type === 'short') {
    const val = ans ? ans.value : '';
    const dis = ans ? 'disabled' : '';
    html += `<div class="short-answer-wrap">
      <input type="text" class="short-input" id="input-${q.id}" placeholder="답을 입력하세요" value="${val}" ${dis}>
      <button class="reveal-btn" onclick="${ans ? `resetAnswer(${q.id})` : `submitShort(${q.id})`}">${ans ? '↻ 다시 풀기' : '정답 확인'}</button>
    </div>`;
  } else if (q.type === 'long') {
    const val = ans ? ans.value : '';
    const dis = ans ? 'disabled' : '';
    html += `<div class="short-answer-wrap">
      <textarea class="short-input short-textarea" id="input-${q.id}" placeholder="서술형 답을 작성하세요 (작성 후 정답 확인 클릭)" ${dis}>${val}</textarea>
      <button class="reveal-btn" onclick="${ans ? `resetAnswer(${q.id})` : `submitLong(${q.id})`}">${ans ? '↻ 다시 풀기' : '정답 확인'}</button>
    </div>`;
  }
  
  html += `
    <div class="answer-box ${ans ? 'show' : ''}" id="ans-${q.id}">
      <div class="answer-label">정답</div>
      <div class="answer-text">${q.type === 'mc' ? `${['①','②','③','④','⑤'][q.correct]} ${q.options[q.correct]}` : q.answer}</div>
      ${q.explanation ? `<div class="explanation">${q.explanation}</div>` : ''}
    </div>
  `;
  
  card.innerHTML = html;
  return card;
}

function selectMC(id, i) {
  const q = questions.find(x => x.id === id);
  // 이미 답한 상태에서 다시 클릭하면 초기화
  if (answered[id]) {
    delete answered[id];
    render();
    return;
  }
  answered[id] = { value: i, correct: i === q.correct };
  render();
}

function selectOX(id, val) {
  const q = questions.find(x => x.id === id);
  // 이미 답한 상태에서 다시 클릭하면 초기화
  if (answered[id]) {
    delete answered[id];
    render();
    return;
  }
  answered[id] = { value: val, correct: val === q.answer };
  render();
}

function resetAnswer(id) {
  delete answered[id];
  render();
}

function submitShort(id) {
  if (answered[id]) return;
  const input = document.getElementById('input-' + id);
  const q = questions.find(x => x.id === id);
  const userVal = input.value.trim();
  // Check substring match for short answers
  const correctText = q.answer.toLowerCase();
  const userLower = userVal.toLowerCase();
  // Extract the key answer (e.g., "ㄱ (설총)" → check both "ㄱ" and "설총")
  const isCorrect = userVal.length > 0 && (
    correctText.includes(userLower) || 
    userLower.includes(correctText.replace(/[()ㄱㄴㄷㄹㅁㅂ\s]/g, '').toLowerCase()) ||
    // Extract Korean text in parentheses or main text
    (q.answer.match(/[가-힣]+/g) || []).some(part => userLower.includes(part.toLowerCase()))
  );
  answered[id] = { value: userVal, correct: isCorrect };
  render();
}

function submitLong(id) {
  if (answered[id]) return;
  const input = document.getElementById('input-' + id);
  const userVal = input.value.trim();
  // Long answers: just mark as "viewed" - user self-evaluates
  answered[id] = { value: userVal, correct: userVal.length > 10 };
  render();
}

function revealAll() {
  questions.forEach(q => {
    if (!answered[q.id]) {
      if (q.type === 'mc') {
        answered[q.id] = { value: q.correct, correct: true };
      } else if (q.type === 'ox') {
        answered[q.id] = { value: q.answer, correct: true };
      } else {
        answered[q.id] = { value: '(미작성)', correct: true };
      }
    }
  });
  render();
}

function hideAll() {
  answered = {};
  render();
}

function resetAll() {
  if (confirm('모든 답안과 진행 상황을 초기화하시겠습니까?')) {
    answered = {};
    render();
  }
}

function updateProgress() {
  const total = questions.length;
  const ansCount = Object.keys(answered).length;
  const correctCount = Object.values(answered).filter(a => a.correct).length;
  const wrongCount = ansCount - correctCount;
  const pct = total > 0 ? Math.round(ansCount / total * 100) : 0;
  
  document.getElementById('answeredCount').textContent = ansCount;
  document.getElementById('correctCount').textContent = correctCount;
  document.getElementById('wrongCount').textContent = wrongCount;
  document.getElementById('progressFill').style.width = pct + '%';
  
  // Update total in UI
  const totalDisplay = document.querySelector('.pct');
  if (totalDisplay) {
    totalDisplay.innerHTML = `<span id="answeredCount">${ansCount}</span>/${total}`;
  }
}

document.querySelectorAll('.filter-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentFilter = tab.dataset.filter;
    render();
  });
});

// Image modal
function openImageModal(key) {
  if (typeof IMAGES === 'undefined' || !IMAGES[key]) return;
  document.getElementById('modalImg').src = IMAGES[key];
  document.getElementById('imgModal').classList.add('show');
}
function closeImageModal() {
  document.getElementById('imgModal').classList.remove('show');
}

// Initial render
render();

// Update header count to actual total
document.querySelector('.subtitle').textContent = `자습서 · 평가문제집 통합 문제 (총 ${questions.length}문제)`;
</script>
